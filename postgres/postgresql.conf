# PostgreSQL 17 + pgvector, tuned for a 16-core / 60 GB VM that is shared with
# the Sherpa apps themselves (so Postgres is deliberately not given most of the RAM).
# Revisit if the VM size changes. Apply edits with:  ./scripts/compose.sh restart postgres

# --- Connections -------------------------------------------------------------
listen_addresses = '*'            # reachable only on Docker networks + host loopback
port = 5432
max_connections = 200
password_encryption = scram-sha-256

# --- Memory ------------------------------------------------------------------
shared_buffers = 8GB
effective_cache_size = 32GB
work_mem = 32MB
maintenance_work_mem = 2GB        # also speeds up pgvector HNSW/IVFFlat index builds

# --- Parallelism -------------------------------------------------------------
max_worker_processes = 16
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- WAL / checkpoints -------------------------------------------------------
wal_compression = on
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Planner (SSD-backed network volume) -------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Extensions --------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'

# --- Logging (goes to `docker logs sherpa-postgres`) --------------------------
log_min_duration_statement = 1000 # log statements slower than 1 s
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '
timezone = 'UTC'
log_timezone = 'UTC'
